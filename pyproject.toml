[tool.poetry]
name = "konfidant"
version = "1.0.0"
description = "Python SDK for the Konfidant API (client-side encrypted, zero-knowledge sharing)"
license = "MIT"
packages = [{ include = "konfidant" }]

[tool.poetry.dependencies]
python = ">=3.11"
httpx = "^0.28"
cryptography = ">=44"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
respx = "^0.23"
pytest-cov = "^7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "konfidant"
version = "1.0.0"
authors = [
  { name="Konfidant", email="hello@konfidant.app" },
]

description = "Python SDK for the Konfidant API (client-side encrypted, zero-knowledge sharing)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "cryptography>=44",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"

[project.urls]
Homepage = "https://github.com/konfidant/sdk-py"
Issues = "https://github.com/konfidant/sdk-py/issues"
